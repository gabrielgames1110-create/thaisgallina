<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thais Gallina · Consultório Odontológico em Venâncio Aires</title>
<meta name="description" content="Consultório da Dra. Thaís Gallina Frantz, especialista em Ortodontia, em Venâncio Aires (RS). Ortodontia, estética do sorriso, harmonização orofacial e atendimento para toda a família.">
<link rel="stylesheet" href="styles.css">
<style>
/* Page layout only — every visual comes from the design system. */
html { scroll-behavior: smooth; }
.section { padding: var(--section-space) 0; }

.hero { overflow: hidden; padding: clamp(48px, 6vw, 80px) 0 clamp(104px, 10vw, 136px); background: var(--color-bg-soft); }
.hero__grid { display: grid; grid-template-columns: minmax(0, 48fr) minmax(0, 52fr); align-items: center; gap: var(--space-10); }
.hero__copy { display: grid; justify-items: start; gap: var(--space-8); }
.hero__actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4) var(--space-8); }
.hero__visual { position: relative; justify-self: end; width: min(100%, 420px); aspect-ratio: 4 / 5; margin-right: 7%; }
.hero__arch { position: absolute; inset: 7% -7% -7% 7%; border-radius: 50% 50% var(--radius-xl) var(--radius-xl) / 40% 40% var(--radius-xl) var(--radius-xl); background: var(--color-brand); }
.hero__spark { position: absolute; z-index: 1; color: var(--color-accent-mark); }
.hero__spark--lg { top: -2%; right: -14%; }
.hero__spark--sm { top: 10%; right: -22%; }
.hero__portrait { position: absolute; inset: 0; }
.hero__credit { position: absolute; z-index: 2; left: -14%; bottom: 7%; display: grid; gap: 2px; padding: 12px 18px; border-radius: var(--radius-lg); background: var(--color-white); box-shadow: var(--shadow-floating); }
.hero__credit-name { color: var(--color-ink); font-size: 15px; font-weight: 600; line-height: 1.3; }
.hero__credit-meta { color: var(--color-text-secondary); font-size: var(--font-size-xs); line-height: 1.4; }

.booking { position: relative; z-index: 2; margin-top: -64px; }

.about__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: clamp(40px, 6vw, 96px); }
.about__media { position: relative; width: min(100%, 520px); aspect-ratio: 1; }
.about__main { position: absolute; top: 0; right: 0; width: 76%; height: 92%; }
.about__spark { position: absolute; color: var(--color-accent-mark); }
.about__spark--lg { top: 4%; left: 6%; }
.about__spark--sm { top: 22%; left: 18%; }
.about__copy { display: grid; justify-items: start; gap: var(--space-8); }

.seal { position: absolute; left: 10%; bottom: 8%; display: grid; place-items: center; width: 112px; height: 112px; border-radius: 50%; background: var(--color-ink); color: var(--color-white); text-decoration: none; box-shadow: 0 0 0 6px var(--color-white); }
.seal:hover { color: var(--color-white); }
.seal > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.seal text { fill: currentColor; font-size: 8.4px; font-weight: 600; }
.seal__core { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--color-accent); color: var(--color-ink); transition: background-color var(--duration-fast) var(--ease-standard); }
.seal:hover .seal__core { background: var(--color-accent-on-primary); }

.services { background: var(--color-bg-soft); }
.services__grid { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--grid-gap); margin-top: var(--space-12); }
.services__grid > * { flex: 0 0 calc((100% - 3 * var(--grid-gap)) / 4); min-width: 0; }
@media (max-width: 1099px) { .services__grid > * { flex-basis: calc((100% - 2 * var(--grid-gap)) / 3); } }
#agendar { scroll-margin-top: 120px; }

.results__grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--grid-gap); margin-top: var(--space-12); }
.results__item { margin: 0; }
.results__open { display: block; width: 100%; aspect-ratio: 4 / 5; padding: 0; overflow: hidden; border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-bg-soft); cursor: zoom-in; }
.results__open img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--duration-base) var(--ease-out); }
.results__open:hover img { transform: scale(1.03); }
.results__caption { margin-top: var(--space-3); }
.results__full { display: block; max-width: 100%; max-height: 70vh; margin: var(--space-2) auto 0; border-radius: var(--radius-lg); }

.testimonials { background: var(--color-bg-soft); }
.testimonials__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: var(--grid-gap); margin-top: var(--space-12); }

.contact__grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); align-items: start; gap: clamp(32px, 5vw, 80px); }
.contact__info { display: grid; justify-items: start; gap: var(--space-8); }
.contact__list { display: grid; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
.contact__list li { display: flex; align-items: flex-start; gap: var(--space-3); }
.contact__list .icon { margin-top: 0.2em; color: var(--color-primary); }
.contact__list a { color: var(--color-ink); font-weight: 500; text-decoration: none; }
.contact__list a:hover { color: var(--color-primary); text-decoration: underline; }
.contact__actions { display: flex; flex-wrap: wrap; gap: var(--space-3); }

.hours { padding: var(--space-6) var(--space-6) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-card); background: var(--color-white); box-shadow: var(--shadow-card); }
.hours__head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
.hours__title { font-size: var(--text-h4-size); font-weight: 600; letter-spacing: var(--text-h4-tracking); line-height: var(--text-h4-line); }
.hours__list { margin: 0; }
.hours__row { display: flex; justify-content: space-between; gap: var(--space-4); margin: 0 calc(-1 * var(--space-3)); padding: 10px var(--space-3); border-top: 1px solid var(--color-divider); font-size: var(--text-aux-size); }
.hours__row dt { color: var(--color-text-body); }
.hours__row dd { margin: 0; color: var(--color-ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.hours__row--today { border-top-color: transparent; border-radius: var(--radius-md); background: var(--color-primary-subtle); }
.hours__row--today + .hours__row { border-top-color: transparent; }
.hours__row--today dt, .hours__row--today dd { color: var(--color-primary-strong); font-weight: 600; }

.footer { padding: var(--space-8) 0; border-top: 1px solid var(--color-border); }
.footer__inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4) var(--space-8); }
.footer__logo { width: auto; height: 40px; }
.footer__text { color: var(--color-text-secondary); font-size: var(--text-aux-size); }

@media (max-width: 899px) {
  .results__grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero__credit { left: -4%; }
  .contact__grid { grid-template-columns: minmax(0, 1fr); }
  .hero__grid, .about__grid { grid-template-columns: minmax(0, 1fr); }
  .hero__visual { justify-self: center; width: min(84%, 380px); }
  .about__media { justify-self: center; }
  .services__grid > * { flex-basis: calc((100% - var(--grid-gap)) / 2); }
  .booking { margin-top: -48px; }
}
@media (max-width: 599px) {
  .services__grid > * { flex-basis: 100%; }
  .hero__actions { width: 100%; }
  .hero__actions > .button--lg { width: 100%; }
  .seal { width: 92px; height: 92px; }
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
<script src="js/ds-loader.js"></script>
</head>

</html>
